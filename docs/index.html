<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Corrida TikTok VGZERATV</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:white;background:#0b1124}.screen{height:100vh;min-height:570px;padding:22px;display:flex;flex-direction:column;background:radial-gradient(ellipse at top,#253b65,#080d1c)}h1{text-align:center;font-size:clamp(26px,5vw,58px);margin:0 0 7px;text-shadow:0 4px #000}.sub{text-align:center;color:#ffdc7c;font-size:clamp(14px,2.2vw,24px);font-weight:800;margin-bottom:15px}.lane{position:relative;flex:1;min-height:160px;border:3px solid #fff5;border-radius:18px;margin:7px 0;background:repeating-linear-gradient(90deg,#34465f 0 90px,#2b3851 90px 180px);overflow:hidden}.lula{border-color:#ff7272}.bolsonaro{border-color:#ffd45d}.lane:after{content:'';position:absolute;right:55px;top:0;bottom:0;width:26px;background:conic-gradient(white 25%,#101010 0 50%,white 0 75%,#101010 0) 0 0/26px 26px}.info{position:absolute;top:16px;left:18px;font-size:clamp(19px,3vw,35px);font-weight:900;z-index:2}.points{font-size:20px;background:#0b1029dd;padding:7px;border-radius:8px}.runner{position:absolute;width:106px;height:130px;bottom:4px;left:2%;transition:left .65s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 7px 5px #0009);animation:hop .34s infinite alternate;z-index:3}.runner svg{width:100%;height:100%}@keyframes hop{to{transform:translateY(-9px) rotate(3deg)}}footer{display:flex;justify-content:space-between;gap:12px;font-weight:bold;padding-top:12px}#status{color:#afc5db}#winner{display:none;position:fixed;inset:22%;border:5px solid gold;border-radius:24px;background:#080c20f5;z-index:20;align-items:center;justify-content:center;text-align:center;font-weight:900;font-size:clamp(28px,5vw,62px)}#winner.show{display:flex}#demo{display:none;position:fixed;bottom:48px;left:50%;transform:translateX(-50%);z-index:30;padding:12px;background:#171d30;border-radius:12px;gap:6px}#demo button{padding:10px;cursor:pointer}
</style><div class="screen"><h1>🏁 LULA X BOLSONARO 🏁</h1><div class="sub">🎁 PRESENTES MOVIMENTAM SUA EQUIPE!</div>
<div class="lane lula"><div class="info">🔴 LULA <span class="points" id="lp">0 PTS</span></div><div class="runner" id="la"><svg viewBox="0 0 110 130"><path d="M36 85L18 116 33 121 50 95M72 87L88 116 103 111 80 83" fill="#303c63" stroke="#0b1124" stroke-width="4"/><path d="M35 72Q55 60 75 72L80 101 30 101Z" fill="#c52538" stroke="#6e1425" stroke-width="4"/><path d="M32 78L6 91 14 105 45 88M77 78L104 91 97 104 67 89" fill="#e4aa7f" stroke="#a05c40" stroke-width="3"/><ellipse cx="55" cy="42" rx="29" ry="35" fill="#eab185" stroke="#a66c49" stroke-width="3"/><path d="M26 33Q22 5 53 7Q79 4 84 33L70 22 62 14 52 21 38 18Z" fill="#e2e2dd"/><path d="M29 54Q35 84 57 80Q80 73 81 53Q71 66 64 63L55 67 46 63 38 65Z" fill="#eeeeeb" stroke="#aaaaa6" stroke-width="2"/><circle cx="45" cy="40" r="3"/><circle cx="67" cy="40" r="3"/><path d="M43 55Q55 61 66 55" stroke="#924a38" stroke-width="3" fill="none"/></svg></div></div>
<div class="lane bolsonaro"><div class="info">🟡 BOLSONARO <span class="points" id="bp">0 PTS</span></div><div class="runner" id="ba"><svg viewBox="0 0 110 130"><path d="M36 85L18 116 33 121 50 95M72 87L88 116 103 111 80 83" fill="#303c63" stroke="#0b1124" stroke-width="4"/><path d="M35 72Q55 60 75 72L80 101 30 101Z" fill="#268b51" stroke="#174e32" stroke-width="4"/><path d="M32 78L6 91 14 105 45 88M77 78L104 91 97 104 67 89" fill="#e4aa7f" stroke="#a05c40" stroke-width="3"/><ellipse cx="55" cy="42" rx="29" ry="35" fill="#e6aa80" stroke="#a66c49" stroke-width="3"/><path d="M25 30Q29 5 56 9Q81 6 84 30L73 24 64 17 55 21 38 19Z" fill="#55534d"/><circle cx="44" cy="43" r="3"/><circle cx="66" cy="43" r="3"/><path d="M40 34L49 32M61 31L74 34" stroke="#403d39" stroke-width="3"/><path d="M43 59Q56 65 70 56" fill="none" stroke="#814331" stroke-width="3"/></svg></div></div>
<footer><span id="last">🎁 Aguardando presentes</span><span id="status">Conectando...</span></footer></div><div id="winner">🏆 <span id="winnerName"></span> VENCEU!</div><div id="demo"><button onclick="add('lula')">🎁 Lula</button><button onclick="add('bolsonaro')">🎁 Bolsonaro</button><button onclick="reset()">↻ Reiniciar</button></div>
<script>
const demo=true;let p={lula:0,bolsonaro:0},meta=100,winner=null;
function render(){document.getElementById("lp").textContent=p.lula+" PTS";document.getElementById("bp").textContent=p.bolsonaro+" PTS";document.getElementById("la").style.left=(2+72*Math.min(p.lula/meta,1))+"%";document.getElementById("ba").style.left=(2+72*Math.min(p.bolsonaro/meta,1))+"%";document.getElementById("winner").classList.toggle("show",!!winner);document.getElementById("winnerName").textContent=winner?winner.toUpperCase():""}
function add(team){if(winner)return;p[team]=Math.min(meta,p[team]+5);if(p[team]>=meta)winner=team;document.getElementById("last").textContent="🎮 Demonstração: +5 "+team.toUpperCase();render()}
function reset(){p={lula:0,bolsonaro:0};winner=null;render()}
async function tick(){if(demo)return;try{const j=await(await fetch("/api/state",{cache:"no-store"})).json();p.lula=j.estado.lula;p.bolsonaro=j.estado.bolsonaro;winner=j.estado.vencedor;meta=j.config.meta;document.getElementById("status").textContent=j.estado.status;document.getElementById("last").textContent="🎁 "+j.estado.ultimo;render()}catch(e){document.getElementById("status").textContent="Servidor desconectado"}}if(demo){document.getElementById("demo").style.display="flex";document.getElementById("status").textContent="DEMONSTRAÇÃO (sem presentes reais)"}else{tick();setInterval(tick,1000)}render();
</script></html>
