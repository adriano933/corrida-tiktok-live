<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel VGZERATV</title><style>body{background:#10182a;color:white;font:16px Arial;max-width:650px;margin:35px auto;padding:20px}section{background:#222e48;padding:22px;border-radius:14px;margin:15px 0}label{display:block;margin:12px 0}input{display:block;margin-top:6px;padding:10px;width:95%;border-radius:7px;border:0}button{padding:13px;margin:5px 0;cursor:pointer;border:0;border-radius:8px;font-weight:bold}a{color:#8fcaff}#status{background:#18263f;padding:16px;border-radius:9px}</style><h1>🏁 Corrida VGZERATV</h1><p id="status">Conectando...</p><section><h2>Configuração</h2><label>Seu @TikTok<input id="usuario"></label><label>Nome exato do presente: Lula<input id="presente_lula"></label><label>Nome exato do presente: Bolsonaro<input id="presente_bolsonaro"></label><label>Pontos por presente<input id="pontos_por_presente" type="number" min="1"></label><label>Meta de pontos<input id="meta" type="number" min="1"></label><button onclick="save()">💾 Salvar</button><p id="message"></p><small>Reinicie o aplicativo após trocar o @.</small></section><section><h2>Teste gratuito</h2><button onclick="post('/api/simular',{equipe:'lula'})">🎁 Simular Lula</button><button onclick="post('/api/simular',{equipe:'bolsonaro'})">🎁 Simular Bolsonaro</button><button onclick="post('/api/reset',{})">🔁 Nova rodada</button></section><section><h2>OBS</h2><p>Fonte Navegador (1280 × 720): <a href="/" target="_blank">http://127.0.0.1:8765/</a></p></section><script>let dirty=false;const keys=['usuario','presente_lula','presente_bolsonaro','pontos_por_presente','meta'];keys.forEach(k=>document.getElementById(k).addEventListener('input',()=>dirty=true));async function post(path,data){let r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});return r.json()}async function save(){const d={};keys.forEach(k=>d[k]=document.getElementById(k).value);await post('/api/config',d);dirty=false;document.getElementById('message').textContent='Salvo!'}async function tick(){try{const j=await(await fetch('/api/state',{cache:'no-store'})).json();document.getElementById('status').textContent='TikTok: '+j.estado.status+' | '+j.estado.ultimo;if(!dirty)keys.forEach(k=>document.getElementById(k).value=j.config[k])}catch(e){document.getElementById('status').textContent='Servidor não conectado'}}tick();setInterval(tick,1500)</script></html>
